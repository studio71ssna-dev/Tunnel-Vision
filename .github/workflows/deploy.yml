name: 🎮 Build & Deploy Unity (TunnelVision)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Push (${{ matrix.targetPlatform }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: WebGL
            itchChannel: html
          - targetPlatform: StandaloneWindows64
            itchChannel: windows
          # ⚠️ Enable Android later if needed (slow)
          # - targetPlatform: Android
          #   itchChannel: android

    steps:
      # 1️⃣ Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2️⃣ Cache Library (HUGE speed boost)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ github.ref }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # 3️⃣ Free Disk Space (Unity needs it)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      # 4️⃣ Build Unity
      - name: Build Unity Game
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: TunnelVision

      # 5️⃣ Compress Build (important for itch)
      - name: Zip Build
        run: |
          cd build/${{ matrix.targetPlatform }}
          zip -r ../${{ matrix.targetPlatform }}.zip .

      # 6️⃣ Save Artifact (backup if itch fails)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}.zip

      # 7️⃣ Push to itch (LATEST channel)
      - name: Push to itch.io (latest)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: ${{ matrix.itchChannel }}
          ITCH_GAME: tunnelvision
          ITCH_USER: studio-71
          PACKAGE: build/${{ matrix.targetPlatform }}.zip

      # 8️⃣ Push versioned build (history preserved)
      - name: Push to itch.io (versioned)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: ${{ matrix.itchChannel }}-${{ github.run_number }}
          ITCH_GAME: tunnelvision
          ITCH_USER: studio-71
          PACKAGE: build/${{ matrix.targetPlatform }}.zip